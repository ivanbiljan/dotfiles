# =============================================================================
# VSCode Night — kitty theme
# Built on the dark palette of Mofiqul/vscode.nvim, retuned for a terminal:
# the 16 ANSI slots are spread across vscode's syntax colors so that shells,
# git, ls and TUIs get the same hues nvim uses, and every "bright" variant is
# visibly lighter than its normal counterpart.
# =============================================================================

# ── Base ─────────────────────────────────────────────────────────────────────
# Same background as vscode.nvim (vscBack) so transparent nvim blends in
foreground              #D4D4D4
background              #1F1F1F

# Selection keeps syntax colors and uses vscode's editor selection blue
selection_foreground    none
selection_background    #264F78

# Cursor
cursor                  #AEAFAD
cursor_text_color       #1F1F1F

# Links
url_color               #4FC1FF
url_style               curly

# ── Window borders (splits) ──────────────────────────────────────────────────
active_border_color     #569CD6
inactive_border_color   #444444
bell_border_color       #F44747
visual_bell_color       #51504F

# ── Tab bar (mirrors vscode's editor tabs) ───────────────────────────────────
tab_bar_background      #252526
active_tab_background   #1F1F1F
active_tab_foreground   #FFFFFF
active_tab_font_style   bold
inactive_tab_background #2D2D2D
inactive_tab_font_style normal
inactive_tab_foreground #8C8C8C

# ── Marks ────────────────────────────────────────────────────────────────────
mark1_foreground        #1F1F1F
mark1_background        #569CD6
mark2_foreground        #1F1F1F
mark2_background        #DCDCAA
mark3_foreground        #1F1F1F
mark3_background        #C586C0

# ── ANSI colors ──────────────────────────────────────────────────────────────

# black — raised surface / suggestion gray (zsh autosuggestions use color8)
color0  #2D2D2D
color8  #6A6A6A

# red — vscode error red, bright lifted toward salmon
color1  #F44747
color9  #FF7B72

# green — git "added" green reads better than the comment green on dark bg
color2  #81B88B
color10 #B5CEA8

# yellow — vscode string-escape gold / function yellow
color3  #D7BA7D
color11 #DCDCAA

# blue — keyword blue / accent blue
color4  #569CD6
color12 #4FC1FF

# magenta — control-flow pink, bright lifted
color5  #C586C0
color13 #DDA6D8

# cyan — type teal / variable light blue
color6  #4EC9B0
color14 #9CDCFE

# white
color7  #D4D4D4
color15 #FFFFFF
