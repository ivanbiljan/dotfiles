# Fix colors
set -g default-terminal 'tmux-256color'
set-option -as terminal-overrides ",xterm*:Tc"

# Fix hyperlinks
set -as terminal-features ",*:hyperlinks"

# OSC-52
set -s set-clipboard on

# Remap prefix from Ctrl + b to Ctrl + Space
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

# Remove 0-based container indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Enable mouse control
set -g mouse on

# Detect whether the active pane is running nvim and if so forward the keystroke to nvim, otherwise let tmux
# handle the pane switch    
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# =============================================================================
# VSCode Night tmux theme
# Matches kitty/colors-vscode.conf (vscode.nvim dark palette). The bar uses the
# terminal's default background so it shares kitty's transparency.
# =============================================================================

# ── Color palette reference ──────────────────────────────────────────────────
#   back         #1F1F1F    editor background (text on accent pills)
#   raised       #2D2D2D    inactive tab / elevated surfaces
#   split        #444444    pane borders
#   suggestion   #6A6A6A    inactive tab index
#   ignored      #8C8C8C    inactive tab names
#   front        #D4D4D4    main foreground
#   white        #FFFFFF    active tab name
#   blue         #569CD6    primary accent (normal mode)
#   yellow       #DCDCAA    prefix active
#   pink         #C586C0    copy mode
#   blue_green   #4EC9B0    zoom / sync indicators
#   yellow_orng  #D7BA7D    activity
#   red          #F44747    bell
#   selection    #264F78    copy-mode selection
#   search       #613315    copy-mode search matches
# ─────────────────────────────────────────────────────────────────────────────

# Accent follows client state: yellow while prefix is held, pink in copy mode
set -g @accent "#{?client_prefix,##DCDCAA,#{?pane_in_mode,##C586C0,##569CD6}}"

# ── Status bar ───────────────────────────────────────────────────────────────

set -g status-style "bg=default,fg=#8C8C8C"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Left: mode icon + session name, plus a sync marker when panes are synchronized
set -g status-left "#[fg=#{E:@accent},bg=default]#[fg=#1F1F1F,bg=#{E:@accent},bold]#{?client_prefix,󰘳,#{?pane_in_mode,󰆏,}} #S#[fg=#{E:@accent},bg=default,nobold]#{?pane_synchronized,#[fg=#4EC9B0] 󰓦,}  "

set -g status-right ""

# ── Window tabs ──────────────────────────────────────────────────────────────
# Both formats have the same width so tabs don't shift when focus changes.

# Inactive window
set -g window-status-format "#[fg=#6A6A6A,bg=default] #I  #[fg=#8C8C8C]#W#{?window_zoomed_flag,#[fg=#4EC9B0] 󰁌,}   "

# Active window: accent index pill joined to a raised name pill
set -g window-status-current-format "#[fg=#{E:@accent},bg=default]#[fg=#1F1F1F,bg=#{E:@accent},bold]#I #[fg=#FFFFFF,bg=#2D2D2D,nobold] #W#{?window_zoomed_flag,#[fg=#4EC9B0] 󰁌,} #[fg=#2D2D2D,bg=default] "

set -g window-status-separator ""

# tmux 3.8 underlines the current window by default; the formats above do the styling
set -g window-status-style default
set -g window-status-current-style default

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-lines heavy
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#{?client_prefix,##DCDCAA,##569CD6}"

# ── Messages & command line ──────────────────────────────────────────────────

set -g message-style "bg=#2D2D2D,fg=#FFFFFF"
set -g message-command-style "bg=#2D2D2D,fg=#569CD6"

# ── Copy mode highlight ─────────────────────────────────────────────────────

set -g mode-style "bg=#264F78,fg=#FFFFFF"
set -g copy-mode-match-style "bg=#613315,fg=#D4D4D4"
set -g copy-mode-current-match-style "bg=#569CD6,fg=#1F1F1F"

# ── Clock ────────────────────────────────────────────────────────────────────

set -g clock-mode-colour "#569CD6"

# ── Bell / activity ─────────────────────────────────────────────────────────

set -g window-status-activity-style "fg=#D7BA7D,bg=default"
set -g window-status-bell-style "fg=#F44747,bg=default,bold"

# ── Display pane indicators ─────────────────────────────────────────────────

set -g display-panes-active-colour "#569CD6"
set -g display-panes-colour "#444444"
