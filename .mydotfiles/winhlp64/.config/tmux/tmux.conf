# Fix colors
set -g default-terminal 'tmux-256color'
set-option -as terminal-overrides ",xterm*:Tc"

# Fix hyperlinks
set -as terminal-features ",*:hyperlinks"

# OSC-52
set -s set-clipboard on

# Remap prefix from Ctrl + b to Ctrl + Space
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

# Remove 0-based container indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Enable mouse control
set -g mouse on

# Detect whether the active pane is running nvim and if so forward the keystroke to nvim, otherwise let tmux
# handle the pane switch    
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# =============================================================================
# Ember Dusk tmux theme
# Deep ink-violet base, ember accent, teal/rose/violet for state
# =============================================================================

# ── Color palette reference ──────────────────────────────────────────────────
#   ink          #16141F    status bar / deepest surface
#   dusk         #211E2E    elevated surfaces (active tab body, messages)
#   haze         #3B3650    borders / separators
#   mist         #6E6888    muted text (inactive tab index)
#   fog          #9C96B5    inactive tab names
#   lilac        #CFC9E0    main foreground
#   snow         #F2EEFF    bright foreground
#   ember        #F2A65A    primary accent (normal mode)
#   rose         #E8697D    prefix active / bell
#   violet       #A88BFA    copy mode
#   teal         #5FC9B4    zoom / sync indicators
#   gold         #E9C46A    activity
# ─────────────────────────────────────────────────────────────────────────────

# Accent follows client state: rose while prefix is held, violet in copy mode
set -g @accent "#{?client_prefix,##E8697D,#{?pane_in_mode,##A88BFA,##F2A65A}}"

# ── Status bar ───────────────────────────────────────────────────────────────

set -g status-style "bg=#16141F,fg=#9C96B5"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Left: mode icon + session name, plus a sync marker when panes are synchronized
set -g status-left "#[fg=#{E:@accent},bg=#16141F]#[fg=#16141F,bg=#{E:@accent},bold]#{?client_prefix,󰘳,#{?pane_in_mode,󰆏,}} #S#[fg=#{E:@accent},bg=#16141F,nobold]#{?pane_synchronized,#[fg=#5FC9B4] 󰓦,}  "

set -g status-right ""

# ── Window tabs ──────────────────────────────────────────────────────────────
# Both formats have the same width so tabs don't shift when focus changes.

# Inactive window
set -g window-status-format "#[fg=#6E6888,bg=#16141F] #I  #[fg=#9C96B5]#W#{?window_zoomed_flag,#[fg=#5FC9B4] 󰁌,}   "

# Active window: ember index pill joined to a raised name pill
set -g window-status-current-format "#[fg=#{E:@accent},bg=#16141F]#[fg=#16141F,bg=#{E:@accent},bold]#I #[fg=#F2EEFF,bg=#211E2E,nobold] #W#{?window_zoomed_flag,#[fg=#5FC9B4] 󰁌,} #[fg=#211E2E,bg=#16141F] "

set -g window-status-separator ""

# tmux 3.8 underlines the current window by default; the formats above do the styling
set -g window-status-style default
set -g window-status-current-style default

# ── Pane borders ─────────────────────────────────────────────────────────────

set -g pane-border-lines heavy
set -g pane-border-style "fg=#3B3650"
set -g pane-active-border-style "fg=#{?client_prefix,##E8697D,##F2A65A}"

# ── Messages & command line ──────────────────────────────────────────────────

set -g message-style "bg=#211E2E,fg=#F2EEFF"
set -g message-command-style "bg=#211E2E,fg=#F2A65A"

# ── Copy mode highlight ─────────────────────────────────────────────────────

set -g mode-style "bg=#3B3650,fg=#F2EEFF"
set -g copy-mode-match-style "bg=#A88BFA,fg=#16141F"
set -g copy-mode-current-match-style "bg=#F2A65A,fg=#16141F"

# ── Clock ────────────────────────────────────────────────────────────────────

set -g clock-mode-colour "#F2A65A"

# ── Bell / activity ─────────────────────────────────────────────────────────

set -g window-status-activity-style "fg=#E9C46A,bg=#16141F"
set -g window-status-bell-style "fg=#E8697D,bg=#16141F,bold"

# ── Display pane indicators ─────────────────────────────────────────────────

set -g display-panes-active-colour "#F2A65A"
set -g display-panes-colour "#3B3650"
